name: Game tests and container

"on":
  push:
    branches: [main, "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      FREEFOLDER_SAVE_DIR: /tmp/freefolder-tests
      FREEFOLDER_AUTO_INSTALL_ENGINE: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.1"
          cache: npm
          cache-dependency-path: pokemon_rl/battle_service/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pokemon_rl/requirements.txt
            pokemon_rl/requirements-training.txt
      - name: Install locked Node dependencies
        run: npm --prefix pokemon_rl/battle_service ci --ignore-scripts --no-audit --no-fund
      - name: Install CPU training and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r pokemon_rl/requirements-training.txt
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Run Node engine and frontend tests
        run: node --test pokemon_rl/tests/*.test.cjs
      - name: Run Python game, save, model and training tests
        run: python -X utf8 -B -m unittest discover -s pokemon_rl/tests -p "test_*.py" -v

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the server image without publishing it
        run: docker build --tag freefolder-game:ci .
      - name: Exercise the packaged engine and persistent volume
        run: |
          docker volume create freefolder-ci-saves
          docker run --rm --mount type=volume,source=freefolder-ci-saves,target=/data freefolder-game:ci python -X utf8 -B -c "from services.run_service import RunService; from services.engine_api import default_opponents; s=RunService(); r=s.create(default_opponents(),seed='container-smoke'); b=s.battle_start(r['run_id'],r['token']); assert b['battle']['view']['turn']==1; s.close()"
          docker run --rm --mount type=volume,source=freefolder-ci-saves,target=/data freefolder-game:ci python -c "import sqlite3; db=sqlite3.connect('/data/runs.sqlite3'); assert db.execute('SELECT COUNT(*) FROM runs').fetchone()[0]>0; db.close()"
      - name: Exercise HTTP startup and engine readiness
        run: |
          docker run --detach --name freefolder-ci-web --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m --publish 18765:8765 --mount type=volume,source=freefolder-ci-saves,target=/data freefolder-game:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18765/api/engine/status > /tmp/freefolder-engine-status.json; then break; fi
            sleep 1
          done
          python -c "import json; data=json.load(open('/tmp/freefolder-engine-status.json')); assert data['available']; assert data['engine']['version']=='0.11.11'"
          curl --fail --silent http://127.0.0.1:18765/api/runs/status > /tmp/freefolder-run-status.json
          python -c "import json; data=json.load(open('/tmp/freefolder-run-status.json')); assert data['total_nodes']==20; assert len(data['starter_pool'])==30"
          curl --fail --silent http://127.0.0.1:18765/web/engine-client.js > /dev/null
          curl --fail --silent http://127.0.0.1:18765/web/rogue-client.js > /dev/null
          docker stop --time 10 freefolder-ci-web
          exit_code="$(docker inspect --format '{{.State.ExitCode}}' freefolder-ci-web)"
          case "$exit_code" in 0|143) ;; *) exit 1 ;; esac
          test "$(docker inspect --format '{{.State.OOMKilled}}' freefolder-ci-web)" = "false"
          docker logs freefolder-ci-web 2>&1 | grep -F "Application shutdown complete"
      - name: Show container logs and clean up
        if: always()
        run: |
          docker logs freefolder-ci-web || true
          docker rm --force freefolder-ci-web || true
          docker volume rm freefolder-ci-saves || true
